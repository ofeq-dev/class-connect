name: close tickets on dev merge

# GitHub only auto-closes "Closes #n" issues on merges into the default branch (master).
# Agents merge into dev, and a ticket's dependants are unblocked only once it is closed,
# so close the referenced tickets when a PR merges into dev.
on:
  pull_request:
    types: [closed]
    branches: [dev]

permissions:
  issues: write

jobs:
  close:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const text = `${pr.title}\n${pr.body ?? ""}`;
            const re = /\b(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\s+#(\d+)/gi;
            const numbers = [...new Set([...text.matchAll(re)].map((m) => Number(m[1])))];
            for (const issue_number of numbers) {
              const { data: issue } = await github.rest.issues.get({ ...context.repo, issue_number });
              if (issue.pull_request || issue.state === "closed") continue;
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number,
                body: `Done in #${pr.number}, merged into \`dev\`.`,
              });
              await github.rest.issues.update({ ...context.repo, issue_number, state: "closed", state_reason: "completed" });
            }
