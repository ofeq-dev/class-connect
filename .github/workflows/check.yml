name: check

on:
  pull_request:
  push:
    branches: [dev, master]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build

  # Every push to master deploys (#19). The self-hosted runner on the home server makes only
  # outbound connections; scripts/deploy.sh builds the commit there, checks it again, switches
  # and rolls back if /healthz doesn't report the new SHA.
  deploy:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: [self-hosted, wsl]
    concurrency:
      group: deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: bash scripts/deploy.sh "$GITHUB_SHA"
        env:
          CC_REPO_URL: ${{ github.workspace }}
