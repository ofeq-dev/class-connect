<title>Lecturer Screens Prototype</title>
<!--
  PROTOTYPE, throw away. Wayfinder ticket "Lecturer screens: live attendance, Comment inbox,
  Poll control, Roster" (ofeq-dev/class-connect#17).

  Question: what should the Lecturer's screens look and feel like during and around a Session?
  Round 1 (commit bf73d34) compared Desk console, Pocket and Stage + remote, Binder vs Plain.
  Desk console and Binder won, with notes: too crowded, hard to read at a glance, attendance and
  polls always expanded, Roster too prominent, pinned Comments should sit on top, actions should
  be icons, no IP addresses unless a diagnostic flag is on, saved polls may be incomplete.
  Round 2 (commit 98ac104) compared Calm columns (#d) with Inbox + rail (#e); Calm columns won,
  with quick reactions grouped.
  Round 3: Calm columns only, plus a Topic filter on Comments, a closed poll that stays on the
  card until dismissed (so its results can go on the projector), and a projector window for an
  extended display: "Open projector window" opens it; drag it to the projector and go full
  screen. The thumbnail in the header shows what the class sees; the console picks what it shows.
  Roster, the attendance sheet download and Diagnostics live in the ⋯ menu.
  The Scenario panel plays the Students and the clock. All state is in memory; reload resets it.
-->

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,500..800&display=swap">
<style>

}

.sec { --hl: var(--hl-att); background: var(--surface); background-image: repeating-linear-gradient(to bottom, transparent 0 31px, #EEF2F6 31px 32px); background-attachment: local; border: 1.5px solid var(--line); border-radius: 4px; border-bottom: 7px solid var(--hl); padding: 16px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }

/* icon buttons */

/* glance */

/* comments */

.label { font-size: 12px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }

/* polls */

.bars { display: flex; flex-direction: column; gap: 5px; }

.filters { display: flex; gap: 6px; flex-wrap: wrap; }

@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>

<script>
const VARIANTS = [
  { k: 'd', name: 'Calm columns · round 3' },
];
const NAMES = ['Noa Levi', 'Amir Haddad', 'Maya Cohen', 'Yonatan Peretz', 'Shira Mizrahi', 'Omer Biton', 'Tamar Friedman', 'Daniel Azoulay', 'Lior Katz', 'Yael Shapiro', 'Itay Ben-David', 'Rotem Avraham', 'Nadav Golan', 'Hila Dahan', 'Eitan Malka', 'Adi Rosen', 'Guy Ohana', 'Michal Sasson', 'Ariel Vaknin', 'Neta Elbaz', 'Rami Khoury', 'Lina Mansour', 'Ido Segal', 'Talia Weiss', 'Yuval Harari', 'Dana Amar', 'Bar Levy', 'Sapir Hazan', 'Tom Barak', 'Mor Edri', 'Yarin Gabay', 'Ella Tal'];
const QUICK = ['Too fast', 'Can you repeat that?'];
const OFFNETS = ['37.142.18.0/24', '79.181.4.0/24', '147.235.9.0/24'];
const CLASSROOM = '192.114.52.0/24';
const TYPED = [
  ['The slides are too small to read from the back row', true],
  ['Can we get the diagram from slide 12 after class?', false],
  ['I don’t get why the return arrow is dashed', true],
  ['Is an opt fragment the same as alt with one branch?', false],
];

const svg = d => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${d}</svg>`;
const I = {
  pin: svg('<path d="M9 4h6l-1 6 3 3v2H7v-2l3-3z"/><path d="M12 15v6"/>'),
  check: svg('<path d="M5 12.5l4.5 4.5L19 7"/>'),
  ignore: svg('<path d="M6 6l12 12M18 6L6 18"/>'),
  back: svg('<path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/>'),
  more: svg('<circle cx="5" cy="12" r="1.2"/><circle cx="12" cy="12" r="1.2"/><circle cx="19" cy="12" r="1.2"/>'),
  people: svg('<circle cx="9" cy="8" r="3.2"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"/><path d="M16 4.5a3 3 0 0 1 0 6M21 20c0-2.6-1.6-4.8-4-5.6"/>'),
};
const ib = (icon, label, a, extra = '', cls = '') => `<button class="ib ${cls}" data-a="${a}" ${extra} title="${label}" aria-label="${label}">${I[icon]}</button>`;

function initial() {
  const roster = NAMES.map((name, i) => ({ id: String(318245671 + i * 7919), name, claimed: ![26, 29, 31].includes(i), att: null }));
  roster.slice(0, 18).forEach((r, i) => r.att = { kind: 'present', at: 612 + Math.floor(i / 3) });
  roster[18].att = { kind: 'pending', at: 616, block: OFFNETS[0] };
  roster[19].att = { kind: 'pending', at: 618, block: OFFNETS[0] };
  roster[20].att = { kind: 'pending', at: 621, block: OFFNETS[1] };
  roster[21].att = { kind: 'manual', at: 620 };
  const cm = o => ({ topic: 's7', when: 'during', status: 'New', pinned: false, quick: false, ...o });
  return {
    variant: 'd', grouping: 'grouped', panel: window.innerWidth > 1100, diag: false, menu: false,
    clock: 624, window: 'open', windowAt: 610, approved: [],
    roster, nextId: 100, typedIdx: 0,
    comments: [
      cm({ id: 1, who: null, text: 'Could the slides go up before each Session?', topic: 'gen', when: null, at: 'Mon 16 Nov', status: 'Addressed' }),
      cm({ id: 2, who: null, text: 'Is the midterm open book?', topic: 'mid', when: null, at: 'Thu 19 Nov', pinned: true }),
      cm({ id: 3, who: null, text: 'first!!', topic: 'gen', when: null, at: 'Thu 19 Nov', status: 'Ignored' }),
      cm({ id: 4, who: 6, text: 'Will sequence diagrams be on the midterm?', when: 'before', at: '09:58' }),
      cm({ id: 5, who: 2, text: 'Too fast', quick: true, at: '10:19' }),
      cm({ id: 6, who: 5, text: 'Too fast', quick: true, at: '10:20' }),
      cm({ id: 7, who: null, text: 'Too fast', quick: true, at: '10:21' }),
      cm({ id: 8, who: 9, text: 'Can you repeat that?', quick: true, at: '10:21' }),
      cm({ id: 9, who: 2, text: 'Is an alt fragment just an if/else?', at: '10:22' }),
      cm({ id: 10, who: 11, text: 'Too fast', quick: true, at: '10:23' }),
      cm({ id: 11, who: null, text: 'Can you repeat that?', quick: true, at: '10:23' }),
    ],
    topics: [{ id: 's7', name: 'Session 7' }, { id: 'gen', name: 'General' }, { id: 'a2', name: 'Assignment 2' }, { id: 'mid', name: 'Midterm' }],
    polls: [
      { id: 1, topic: 's7', q: 'How is the pace so far?', options: ['Too slow', 'About right', 'Too fast'], counts: [3, 11, 7], status: 'open', opensAt: 620, closesAt: null },
      { id: 2, topic: 's7', q: 'Ready for the exercise?', options: ['Yes', 'Need 5 more minutes', 'Not yet'], counts: [0, 0, 0], status: 'scheduled', opensAt: 650, closesAt: 655 },
      { id: 3, topic: 's7', q: 'Which diagram did you find hardest last week?', options: ['Class', 'Use case', 'Activity'], counts: [12, 5, 9], status: 'closed', opensAt: 606, closesAt: 611 },
      { id: 4, topic: 's7', q: 'Exam format preference?', options: ['', '', ''], counts: [0, 0, 0], status: 'saved', opensAt: null, closesAt: null },
    ],
    showDone: false, expanded: {}, fresh: null, topicFilter: 'all', focusPoll: 1,
    attOpen: false, pollsOpen: false, drawer: null,
    view: 'live', projecting: false, screen: 'qr', screenPoll: null,
    pollForm: null, rosterQ: '', importBox: null, toast: null,
  };
}
let S = initial();

/* ---------- helpers ---------- */
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmt = m => `${Math.floor(m / 60)}:${String(m % 60).padStart(2, '0')}`;
const hhmm = m => `${String(Math.floor(m / 60)).padStart(2, '0')}:${String(m % 60).padStart(2, '0')}`;
const plural = (n, w, ws) => `${n} ${n === 1 ? w : (ws || w + 's')}`;
const first = n => n.split(' ')[0];
const topicName = id => S.topics.find(t => t.id === id).name;
const isPresent = r => r.att && (r.att.kind === 'present' || r.att.kind === 'manual');
const diag = s => S.diag ? ` <span class="diag">${esc(s)}</span>` : '';
function tally() {
  const present = S.roster.filter(isPresent).length;
  const pending = S.roster.filter(r => r.att && r.att.kind === 'pending').length;
  return { present, pending, missing: S.roster.length - present - pending, total: S.roster.length };
}
function pendingBlocks() {
  const m = {};
  S.roster.forEach(r => { if (r.att && r.att.kind === 'pending') (m[r.att.block] ||= []).push(r); });
  return Object.entries(m);
}
const total = p => p.counts.reduce((a, b) => a + b, 0);
const complete = p => p.q.trim() && p.options.filter(o => o.trim()).length >= 2;
let toastTimer;
function toast(msg, undo) { S.toast = { msg, undo }; clearTimeout(toastTimer); toastTimer = setTimeout(() => { S.toast = null; renderToast(); }, 4000); }

const QR = (() => {
  const n = 29; let s = 7, cells = '';
  const rnd = () => (s = (s * 9301 + 49297) % 233280) / 233280;
  const finder = (x, y) => `<rect x="${x}" y="${y}" width="7" height="7"/><rect x="${x + 1}" y="${y + 1}" width="5" height="5" fill="#fff"/><rect x="${x + 2}" y="${y + 2}" width="3" height="3"/>`;
  for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) {
    const inF = (x < 8 && y < 8) || (x > n - 9 && y < 8) || (x < 8 && y > n - 9);
    if (!inF && rnd() > .52) cells += `<rect x="${x}" y="${y}" width="1" height="1"/>`;
  }
  return `<svg viewBox="-2 -2 ${n + 4} ${n + 4}" shape-rendering="crispEdges" aria-label="Session QR code"><rect x="-2" y="-2" width="${n + 4}" height="${n + 4}" fill="#fff"/><g fill="#111">${cells}${finder(0, 0)}${finder(n - 7, 0)}${finder(0, n - 7)}</g></svg>`;
})();

/* ================= attendance ================= */
function markIcons(r) {
  const p = isPresent(r), a = r.att && r.att.kind === 'absent';
  return `<span class="icons">${ib('check', `Mark ${r.name} present`, 'mark', `data-id="${r.id}" data-v="manual"`, `ok ${p ? 'on' : ''}`)}${ib('ignore', `Mark ${r.name} absent`, 'mark', `data-id="${r.id}" data-v="absent"`, `bad ${a ? 'on' : ''}`)}</span>`;
}
function attGlance() {
  const t = tally();
  return `<div class="glance"><span class="big"><span class="hl">${t.present}</span></span><span class="of">of ${t.total} present</span></div>
    <div class="state">${S.window === 'open' ? `<span class="dot on"></span><span class="grow">Check-in open</span><button class="btn btn-line btn-sm" data-a="closeWindow">Close</button>` : `<span class="dot"></span><span class="grow">Check-in closed</span><button class="btn btn-sm" data-a="openWindow">Reopen</button>`}</div>
    ${S.diag ? `<span class="small">Classroom network${diag(CLASSROOM)}</span>` : ''}`;
}
function pendingAttn() {
  return pendingBlocks().map(([block, rs]) => `<div class="card attn">
      <b>${rs.length === 1 ? `${esc(rs[0].name)} checked in` : `${rs.length} Students checked in`} from another network${diag(block)}</b>
      ${rs.length > 1 ? `<span class="small">${rs.map(r => esc(first(r.name))).join(', ')}</span>` : ''}
      <div class="row"><button class="btn btn-ok" data-a="approve" data-b="${block}">Approve network</button><span class="small muted">for this Session only</span></div></div>`).join('');
}
function attDetail() {
  const pend = S.roster.filter(r => r.att && r.att.kind === 'pending');
  const miss = S.roster.filter(r => !r.att || r.att.kind === 'absent');
  const pres = S.roster.filter(isPresent).sort((a, b) => b.att.at - a.att.at);
  const li = (r, note) => `<li><span class="who">${esc(r.name)} ${note || ''}</span>${markIcons(r)}</li>`;
  return `${pend.length ? `<div class="grp-title">Waiting for approval</div><ul class="plist">${pend.map(r => li(r, `<span class="t">${fmt(r.att.at)}</span>${diag(r.att.block)}`)).join('')}</ul>` : ''}
    <div class="grp-title">Not here yet (${miss.length})</div><ul class="plist">${miss.map(r => li(r, `${r.lapsed ? '<span class="chip c-mute">didn’t get approved</span>' : ''}${!r.claimed ? '<span class="t">no phone yet</span>' : ''}`)).join('')}</ul>
    <div class="grp-title">Present (${pres.length})</div><ul class="plist">${pres.map(r => li(r, `<span class="t">${fmt(r.att.at)}${r.att.kind === 'manual' ? ' · marked by you' : ''}</span>`)).join('')}</ul>`;
}

/* ================= comments ================= */
const who = c => c.who === null ? 'Anonymous' : S.roster[c.who].name;
function inboxItems() {
  const open = S.comments.filter(c => c.status === 'New' && inTopic(c));
  const pinned = open.filter(c => c.pinned).reverse();
  const rest = open.filter(c => !c.pinned).reverse();
  return { pinned: pinned.map(c => ({ one: c })), rest: group(rest) };
}
const inTopic = c => S.topicFilter === 'all' || c.topic === S.topicFilter;
function topicFilters() {
  const n = t => S.comments.filter(c => c.status === 'New' && (t === 'all' || c.topic === t)).length;
  return `<div class="filters">${[['all', 'All']].concat(S.topics.map(t => [t.id, t.name])).map(([id, l]) => `<button class="${S.topicFilter === id ? 'on' : ''}" data-a="set" data-k="topicFilter" data-v="${id}">${l}<b>${n(id) || ''}</b></button>`).join('')}</div>`;
}
function group(cs) {
  if (S.grouping !== 'grouped') return cs.map(c => ({ one: c }));
  const out = [], g = {};
  cs.forEach(c => {
    if (!c.quick) return out.push({ one: c });
    const k = c.topic + '|' + c.text;
    if (!g[k]) { g[k] = { group: [], key: k }; out.push(g[k]); }
    g[k].group.push(c);
  });
  return out.map(x => x.group && x.group.length === 1 ? { one: x.group[0] } : x);
}
function cmIcons(cs) {
  const ids = `data-ids="${cs.map(c => c.id).join(',')}"`;
  if (cs[0].status !== 'New') return `<span class="icons">${ib('back', 'Back to inbox', 'cstatus', `${ids} data-v="New"`)}</span>`;
  const pinned = cs.every(c => c.pinned);
  return `<span class="icons">${ib('pin', pinned ? 'Unpin' : 'Pin to top', 'cpin', ids, pinned ? 'on' : '')}${ib('check', 'Addressed', 'cstatus', `${ids} data-v="Addressed"`, 'ok')}${ib('ignore', 'Ignore', 'cstatus', `${ids} data-v="Ignored"`, 'bad')}</span>`;
}
function meta(c) {
  const where = S.topicFilter !== 'all' ? (c.when === 'before' ? 'before the Session' : '') : c.topic === 's7' ? (c.when === 'before' ? 'before the Session' : '') : topicName(c.topic);
  return [`<b>${esc(who(c))}</b>`, where, c.at].filter(Boolean).map(s => `<span>${s}</span>`).join('');
}
function commentCard(c) {
  return `<div class="card cm ${c.pinned && c.status === 'New' ? 'pinned' : ''} ${S.fresh === c.id ? 'fresh' : ''}"><div class="body"><div class="cm-text">${esc(c.text)}</div><div class="cm-meta">${meta(c)}</div></div>${cmIcons([c])}</div>`;
}
function groupCard(g) {
  const cs = g.group, named = cs.filter(c => c.who !== null), anon = cs.length - named.length, open = S.expanded[g.key];
  const people = named.map(c => first(S.roster[c.who].name)).concat(anon ? [`${anon} anonymous`] : []).join(', ');
  return `<div class="card cm ${cs.some(c => c.id === S.fresh) ? 'fresh' : ''}"><span class="n"><span class="hl">×${cs.length}</span></span>
    <div class="body"><div class="cm-text"><b>${esc(cs[0].text)}</b></div><div class="cm-meta"><span>${open ? esc(people) : ''}</span><span>${cs[cs.length - 1].at}–${cs[0].at}</span><button class="link small" data-a="expand" data-k="${esc(g.key)}">${open ? 'hide names' : 'who?'}</button></div></div>${cmIcons(cs)}</div>`;

function commentsArea() {

    ${S.showDone ? done.map(c => `<div class="card cm"><div class="body"><div class="cm-text muted">${esc(c.text)}</div><div class="cm-meta">${meta(c)}<span>${c.status}</span></div></div>${cmIcons([c])}</div>`).join('') : ''}</section>`;

/* ================= polls ================= */
function bars(p) {
  const t = total(p);
  return `<div class="bars">${p.options.map((o, i) => { const pct = t ? Math.round(p.counts[i] * 100 / t) : 0; return `<div class="bar"><i style="width:${pct}%"></i><span>${esc(o)}</span><b>${p.counts[i]}</b></div>`; }).join('')}</div>`;
}
function currentPoll() {

    || S.polls.find(p => p.status === 'open')

}

  else if (p.status === 'scheduled') h = `<div class="state"><span class="dot"></span><span class="grow">Next poll opens ${fmt(p.opensAt)}</span></div><div class="poll-q">${esc(p.q)}</div>
    <div class="row"><button class="btn btn-line btn-sm" data-a="popen" data-id="${p.id}">Open now</button></div>`;
  else if (p.status === 'closed') h = `<div class="state"><span class="dot"></span><span class="grow">Closed ${fmt(p.closesAt)} · ${plural(total(p), 'vote')} · Students see the results</span></div><div class="poll-q">${esc(p.q)}</div>${bars(p)}
    <div class="row wrap">${onScreen(p) ? '<span class="chip c-ok">Results on projector</span>' : `<button class="btn" data-a="pshow" data-id="${p.id}">Show results on projector</button>`}<button class="btn btn-line" data-a="pdone">Done</button></div>`;
  else h = `<div class="state"><span class="dot"></span><span class="grow">Saved · not open yet</span></div><div class="poll-q">${esc(p.q || 'Untitled poll')}</div>`;

function pollList() {

function pollSection(mode) {
  const n = S.polls.length;
  if (mode === 'drawer') return `<section class="sec drawer" data-s="poll"><div class="sec-head"><h2><span class="hl">Polls</span></h2><button class="link" data-a="drawer" data-v="">Close</button></div>${S.pollForm ? pollForm() : '<button class="btn btn-line" data-a="pnew">+ New poll</button>'}${pollList()}</section>`;
  const toggle = mode === 'rail' ? `<button class="more" data-a="drawer" data-v="polls">▸ All polls (${n})</button>` : `<button class="more" data-a="toggle" data-k="pollsOpen">${S.pollsOpen ? '▾' : '▸'} All polls (${n})</button>${S.pollsOpen ? pollList() : ''}`;
  return `<section class="sec" data-s="poll"><div class="sec-head"><h2><span class="hl">Poll</span></h2></div>${pollGlance()}${toggle}</section>`;
}
function VariantD() {
  return `<div class="console">${header()}${S.view === 'roster' ? rosterView() : `<div class="d-grid">${attSection()}${commentsArea()}${pollSection()}</div>`}</div>`;
}
function VariantE() {
  let h = `<div class="console">${header()}${S.view === 'roster' ? rosterView() : `<div class="e-grid"><div class="e-rail">${attSection('rail')}${pollSection('rail')}</div>${commentsArea()}</div>`}</div>`;
  if (S.drawer) h += `<div class="drawer-bg" data-a="drawer" data-v=""></div>${S.drawer === 'att' ? attSection('drawer') : pollSection('drawer')}`;
  return h;
}
const RENDER = { d: VariantD };
function overlay() {
  if (!S.projecting) return '';
  const hasPoll = S.polls.some(p => p.status === 'open' || p.status === 'closed');
  return `<div class="overlay">${projector()}<div class="ctl"><span class="seg"><button class="${S.screen === 'qr' ? 'on' : ''}" data-a="screen" data-v="qr">QR + count</button><button class="${S.screen === 'poll' ? 'on' : ''}" data-a="screen" data-v="poll" ${hasPoll ? '' : 'disabled'}>Poll</button></span><button class="btn" data-a="unproject">Back to console (Esc)</button></div></div>`;
}

/* ================= actions ================= */
const rosterById = id => S.roster.find(r => r.id === id);
function tickClock(mins) {
  for (let i = 0; i < mins; i++) {
    S.clock++;
    S.polls.forEach(p => {
      if (p.status === 'scheduled' && p.opensAt <= S.clock) { p.status = 'open'; const f = S.polls.find(x => x.id === S.focusPoll); if (!f || f.status !== 'open') S.focusPoll = p.id; if (p.dur) p.closesAt = S.clock + p.dur; toast(`Scheduled poll opened: ${p.q}`); }
      if (p.status === 'open' && p.closesAt && p.closesAt <= S.clock) { p.status = 'closed'; toast(`Poll closed: ${p.q}`); }
      if (p.status === 'open') { const n = 1 + Math.floor(Math.random() * 3); for (let k = 0; k < n; k++) p.counts[Math.floor(Math.random() * p.options.length)]++; }
    });
  }
}
function studentCheckin(where) {
  const r = S.roster.find(x => !x.att && x.claimed);
  if (!r) return toast('Every claimed Student has checked in.');
  if (S.window !== 'open') return toast(`${r.name} scanned, but Check-in is closed.`);
  if (where === 'classroom') { r.att = { kind: 'present', at: S.clock }; return; }
  const block = where === 'off' ? OFFNETS[0] : OFFNETS[S.offIdx = ((S.offIdx ?? 0) % (OFFNETS.length - 1)) + 1];
  r.att = S.approved.includes(block) ? { kind: 'present', at: S.clock } : { kind: 'pending', at: S.clock, block };
}
function studentComment(kind) {
  const idx = S.roster.map((r, i) => isPresent(r) ? i : -1).filter(i => i >= 0);
  const w = idx[Math.floor(Math.random() * idx.length)];
  let c;
  if (kind === 'quick') c = { who: Math.random() < .3 ? null : w, text: QUICK[Math.floor(Math.random() * 2)], quick: true };
  else { const [t, anon] = TYPED[S.typedIdx++ % TYPED.length]; c = { who: anon ? null : w, text: t, quick: false }; }
  S.comments.push({ id: S.nextId++, topic: 's7', when: 'during', status: 'New', pinned: false, at: fmt(S.clock), ...c });
  S.fresh = S.nextId - 1;
}
function submitPoll() {
  const f = S.pollForm;
  const draft = { q: f.q, options: f.options.slice() };
  if (f.open !== 'later' && !complete(draft)) return toast('To open or schedule a poll it needs a question and two answers. Choose Later to save it unfinished.');
  const [h, m] = (f.openAt || '00:00').split(':').map(Number);
  const opensAt = f.open === 'at' ? h * 60 + m : f.open === 'now' ? S.clock : null;
  const dur = f.open !== 'later' && f.close === 'after' ? +f.mins : null;
  const status = f.open === 'now' || (f.open === 'at' && opensAt <= S.clock) ? 'open' : f.open === 'at' ? 'scheduled' : 'saved';
  const p = f.editId ? S.polls.find(x => x.id === f.editId) : { id: S.nextId++, topic: 's7' };
  const options = status === 'saved' ? draft.options : draft.options.map(o => o.trim()).filter(Boolean);
  Object.assign(p, { q: draft.q.trim(), options, counts: options.map(() => 0), status, opensAt, closesAt: status === 'open' && dur ? S.clock + dur : null, dur });
  if (!f.editId) S.polls.push(p);
  if (status === 'open') S.focusPoll = p.id;
  S.pollForm = null;
  toast(status === 'open' ? 'Poll open. Students get a badge and banner.' : status === 'scheduled' ? `Scheduled for ${fmt(opensAt)}` : complete(p) ? 'Saved' : 'Saved as a draft');
}
function act(a, d) {
  switch (a) {
    case 'closeWindow':
      S.window = 'closed';
      S.roster.forEach(r => { if (r.att && r.att.kind === 'pending') { r.att = null; r.lapsed = true; } });
      toast('Check-in closed. Anyone still waiting for approval counts as absent.');
      break;
    case 'openWindow': S.window = 'open'; S.windowAt = S.clock; break;
    case 'approve': {
      S.approved.push(d.b); let n = 0;
      S.roster.forEach(r => { if (r.att && r.att.kind === 'pending' && r.att.block === d.b) { r.att = { kind: 'present', at: r.att.at }; n++; } });
      toast(`${plural(n, 'Student')} now present. That network is accepted for this Session only.`);
      break;
    }
    case 'mark': {
      const r = rosterById(d.id), prev = r.att;
      const same = r.att && r.att.kind === d.v;
      r.att = same ? null : { kind: d.v, at: S.clock };
      S.undo = () => r.att = prev;
      toast(same ? `${r.name}: mark cleared` : `${r.name} marked ${d.v === 'manual' ? 'present' : 'absent'}`, true); break;
    }
    case 'reset': { const r = rosterById(d.id); r.claimed = false; S.undo = () => r.claimed = true; toast(`Claim reset for ${r.name}.`, true); break; }
    case 'undo': if (S.undo) S.undo(); S.undo = null; S.toast = null; break;
    case 'export': S.menu = false; toast('Would download software-engineering-attendance.xlsx'); break;
    case 'cstatus': {
      const ids = d.ids.split(',').map(Number), cs = S.comments.filter(c => ids.includes(c.id)), prev = cs.map(c => [c.status, c.pinned]);
      cs.forEach(c => { c.status = d.v; c.pinned = false; }); S.undo = () => cs.forEach((c, i) => [c.status, c.pinned] = prev[i]);
      toast(d.v === 'New' ? 'Back in the inbox' : `${plural(cs.length, 'Comment')} ${d.v.toLowerCase()}`, true); break;
    }
    case 'cpin': { const ids = d.ids.split(',').map(Number), cs = S.comments.filter(c => ids.includes(c.id)), v = !cs.every(c => c.pinned); cs.forEach(c => c.pinned = v); break; }
    case 'expand': S.expanded[d.k] = !S.expanded[d.k]; break;
    case 'toggle': S[d.k] = !S[d.k]; if (d.k === 'diag') S.menu = false; break;
    case 'drawer': S.drawer = d.v || null; break;
    case 'view': S.view = d.v; S.menu = false; break;
    case 'pnew': S.pollForm = { q: '', options: ['', '', ''], open: 'now', openAt: hhmm(S.clock + 10), close: 'hand', mins: 3 }; break;
    case 'pedit': { const p = S.polls.find(x => x.id === +d.id); S.pollForm = { editId: p.id, q: p.q, options: p.options.concat(p.options.length < 2 ? [''] : []), open: p.status === 'scheduled' ? 'at' : 'later', openAt: hhmm(p.opensAt || S.clock + 10), close: p.dur ? 'after' : 'hand', mins: p.dur || 3 }; break; }
    case 'padd': S.pollForm.options.push(''); break;
    case 'pf': S.pollForm[d.k] = d.v; break;
    case 'pcancel': S.pollForm = null; break;
    case 'popen': { const p = S.polls.find(x => x.id === +d.id); if (!complete(p)) { toast('Finish the poll first.'); break; } p.status = 'open'; p.opensAt = S.clock; p.closesAt = p.dur ? S.clock + p.dur : null; S.focusPoll = p.id; break; }
    case 'pclose': { const p = S.polls.find(x => x.id === +d.id); p.status = 'closed'; p.closesAt = S.clock; toast(onScreen(p) ? 'Closed. Results are on the projector and on Students’ phones.' : 'Closed. Students now see the results on their phones.'); break; }
    case 'pshow': S.screen = 'poll'; S.screenPoll = +d.id; if (!projOpen()) openProjector(); break;
    case 'projwin': if (projOpen()) projWin.focus(); else openProjector(); break;
    case 'pdone': if (onScreen(currentPoll())) S.screen = 'qr'; S.focusPoll = null; break;
    case 'screen': S.screen = d.v; if (d.v === 'poll') { const p = currentPoll(); S.screenPoll = p && p.id; } if (!projOpen()) openProjector(); break;
    case 'project': S.projecting = true; break;
    case 'unproject': S.projecting = false; break;
    case 'importOpen': S.importBox = { text: '' }; break;
    case 'importFile': S.importBox.text = '318245671, Noa Levi\n340120001, Gal Navon\n340120002, Sivan Oren'; break;
    case 'importCancel': S.importBox = null; break;
    case 'importDo': {
      const rows = S.importBox.text.split('\n').map(l => l.split(/[,\t]/).map(s => s.trim())).filter(r => r[0] && r[1] && !S.roster.some(x => x.id === r[0]));
      rows.forEach(([id, name]) => S.roster.push({ id, name, claimed: false, att: null }));
      S.importBox = null; toast(`${plural(rows.length, 'Student')} added.`); break;
    }
    case 'sIn': studentCheckin('classroom'); break;
    case 'sIn5': for (let i = 0; i < 5; i++) studentCheckin('classroom'); break;
    case 'sOff': studentCheckin('off'); break;
    case 'sOffNew': studentCheckin('offNew'); break;
    case 'sQuick': studentComment('quick'); break;
    case 'sTyped': studentComment('typed'); break;
    case 'sTick': tickClock(+d.v); break;
    case 'set': S[d.k] = d.v; break;
    case 'panel': S.panel = !S.panel; break;
    case 'resetAll': { const keep = { variant: S.variant, grouping: S.grouping, panel: S.panel }; S = { ...initial(), ...keep }; break; }
    case 'vprev': case 'vnext': {
      const i = VARIANTS.findIndex(v => v.k === S.variant);
      setVariant(VARIANTS[(i + (a === 'vnext' ? 1 : -1) + VARIANTS.length) % VARIANTS.length].k); return;
    }
  }
  render();
}

/* ================= render ================= */
function pseg(k, opts) { return `<div class="pseg">${opts.map(([v, l]) => `<button class="${S[k] === v ? 'on' : ''}" data-a="set" data-k="${k}" data-v="${v}">${l}</button>`).join('')}</div>`; }
function renderPanel() {
  const dump = {
    variant: S.variant, grouping: S.grouping, diagnostics: S.diag, clock: fmt(S.clock), checkinWindow: S.window, approvedNetworks: S.approved,
    attendance: tally(), pending: Object.fromEntries(pendingBlocks().map(([b, rs]) => [b, rs.map(r => r.name)])),
    polls: S.polls.map(p => `${p.status}: ${p.q || '(untitled)'} [${p.counts.join('/')}]`),
    comments: { open: S.comments.filter(c => c.status === 'New').length, pinned: S.comments.filter(c => c.pinned && c.status === 'New').length, dealtWith: S.comments.filter(c => c.status !== 'New').length },
  };
  $('panel').innerHTML = `<div class="row"><h2 class="grow">Scenario</h2><button class="pb" data-a="panel">Hide</button></div>
    <p>Plays the Students and the clock. Throwaway prototype; reload resets it.</p>
    <div class="g"><span class="eyebrow">Still open</span><div>Quick reactions ${pseg('grouping', [['grouped', 'Grouped with counts'], ['each', 'One by one']])}</div></div>
    <div class="g"><span class="eyebrow">Students</span>
      <button class="pb" data-a="sIn">A Student checks in from the classroom Wi-Fi</button>
      <button class="pb" data-a="sIn5">Five Students check in from the classroom Wi-Fi</button>
      <button class="pb" data-a="sOff">A Student checks in from the same other network as Ariel and Neta</button>
      <button class="pb" data-a="sOffNew">A Student checks in from a different network again</button>
      <button class="pb" data-a="sQuick">A Student sends a quick reaction</button>
      <button class="pb" data-a="sTyped">A Student types a Comment</button></div>
    <div class="g"><span class="eyebrow">Clock (${fmt(S.clock)}; votes trickle in, scheduled polls fire)</span>
      <div class="pseg"><button data-a="sTick" data-v="1">+1 min</button><button data-a="sTick" data-v="5">+5 min</button><button data-a="sTick" data-v="15">+15 min</button><button data-a="sTick" data-v="30">+30 min</button></div></div>
    <button class="pb" data-a="resetAll">Reset everything</button>
    <details open><summary class="eyebrow">State</summary><pre>${esc(JSON.stringify(dump, null, 1))}</pre></details>`;
}
function renderSwitcher() {
  const v = VARIANTS.find(x => x.k === S.variant);
  $('switcher').innerHTML = `<button data-a="vprev" aria-label="Previous variant">←</button><span class="lbl-v">${v.k.toUpperCase()} · ${v.name}</span><button data-a="vnext" aria-label="Next variant">→</button><button class="scen" data-a="panel">Scenario</button>`;
}
function renderToast() { $('toast').innerHTML = S.toast ? `<div class="toast" role="status"><span>${esc(S.toast.msg)}</span>${S.toast.undo ? `<button class="link" data-a="undo">Undo</button>` : ''}</div>` : ''; }
function render() {
  const f = document.activeElement, fKey = f && (f.dataset.in || f.dataset.f), fPos = f && f.selectionStart;
  const dScroll = document.querySelector('.drawer') ? document.querySelector('.drawer').scrollTop : 0;
  document.body.className = S.panel ? 'panel-open' : '';
  $('stage').innerHTML = RENDER[S.variant]();
  syncProjector();
  const dr = document.querySelector('.drawer'); if (dr) dr.scrollTop = dScroll;
  if (fKey) { const el = document.querySelector(`[data-in="${fKey}"], [data-f="${fKey}"]`); if (el) { el.focus(); try { el.setSelectionRange(fPos, fPos); } catch (_) {} } }
  renderPanel(); renderSwitcher(); renderToast();
  S.fresh = null;
}
function setVariant(k) { S.variant = k; S.drawer = null; if (location.hash !== '#' + k) location.hash = k; render(); }

document.addEventListener('click', e => {
  const el = e.target.closest('[data-a]');
  if (!el) { if (S.menu && !e.target.closest('.menu')) { S.menu = false; render(); } return; }
  if (el.tagName === 'SELECT' || el.disabled) return;
  e.preventDefault();
  act(el.dataset.a, el.dataset);
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset.in === 'rosterQ') { S.rosterQ = t.value; render(); }
  if (t.dataset.in === 'importText') { S.importBox.text = t.value; render(); }
  if (t.dataset.f && S.pollForm) { const k = t.dataset.f; if (/^o\d$/.test(k)) S.pollForm.options[+k.slice(1)] = t.value; else S.pollForm[k] = t.value; }
});
document.addEventListener('change', e => { const t = e.target; if (t.dataset.f && S.pollForm) S.pollForm[t.dataset.f] = t.value; });
document.addEventListener('submit', e => { e.preventDefault(); if (e.target.dataset.form === 'poll') { submitPoll(); render(); } });
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { if (S.projecting) S.projecting = false; else if (S.drawer) S.drawer = null; else if (S.menu) S.menu = false; else return; render(); return; }
  if (e.target.closest('input, textarea, select, [contenteditable]')) return;
  if (e.key === 'ArrowRight') act('vnext', {});
  if (e.key === 'ArrowLeft') act('vprev', {});
});
window.addEventListener('hashchange', () => { const k = location.hash.slice(1); if (RENDER[k] && k !== S.variant) setVariant(k); });
const start = location.hash.slice(1);
if (RENDER[start]) S.variant = start;
render();
</script>
