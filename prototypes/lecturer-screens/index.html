<title>Lecturer Screens Prototype</title>
<!--
  PROTOTYPE, throw away. Wayfinder ticket "Lecturer screens: live attendance, Comment inbox,
  Poll control, Roster" (ofeq-dev/class-connect#17).

  Question: what should the Lecturer's screens look and feel like during and around a Session?
  Round 1: three structures, one per device the Lecturer might hold during a Session,
  switchable with the pill at the bottom (or ← / →), stored in the URL hash:
    #a Desk console      laptop in front of the Lecturer; everything on one screen;
                         "Show on projector" hands the projector a public view.
    #b Pocket            phone only; the Student app's tab structure, for the Lecturer.
    #c Stage + remote    the projector shows a public "stage"; the phone is a private remote
                         with a "needs you now" feed.
  Two open questions are toggles in the Scenario panel, so they can be judged on any variant:
    Look: Binder (carried over from the Student app) or Plain.
    Quick reactions in the inbox: grouped with counts, or one by one.
  The Scenario panel plays the Students: Check-ins from the classroom or other networks,
  Comments, quick reactions, votes, and the clock (which fires scheduled Polls).
  All state is in memory; reload resets it. Open the file in a browser; nothing to install.
  Light only, like the Student prototype.
-->

<script>
const VARIANTS = [
  { k: 'a', name: 'Desk console' },
  { k: 'b', name: 'Pocket' },
  { k: 'c', name: 'Stage + remote' },
];
const NAMES = ['Noa Levi', 'Amir Haddad', 'Maya Cohen', 'Yonatan Peretz', 'Shira Mizrahi', 'Omer Biton', 'Tamar Friedman', 'Daniel Azoulay', 'Lior Katz', 'Yael Shapiro', 'Itay Ben-David', 'Rotem Avraham', 'Nadav Golan', 'Hila Dahan', 'Eitan Malka', 'Adi Rosen', 'Guy Ohana', 'Michal Sasson', 'Ariel Vaknin', 'Neta Elbaz', 'Rami Khoury', 'Lina Mansour', 'Ido Segal', 'Talia Weiss', 'Yuval Harari', 'Dana Amar', 'Bar Levy', 'Sapir Hazan', 'Tom Barak', 'Mor Edri', 'Yarin Gabay', 'Ella Tal'];
const QUICK = ['Too fast', 'Can you repeat that?', 'An example would help', 'Can’t see the board', 'Lost me at the last slide'];
const OFFNETS = ['37.142.18.0/24', '79.181.4.0/24', '147.235.9.0/24'];
const CLASSROOM = '192.114.52.0/24';
const TYPED = [
  ['Is an alt fragment just an if/else?', false],
  ['The slides are too small to read from the back row', true],
  ['Can we get the diagram from slide 12 after class?', false],
  ['I don’t get why the return arrow is dashed', true],
];

function initial() {
  const roster = NAMES.map((name, i) => ({ id: String(318245671 + i * 7919), name, claimed: ![26, 29, 31].includes(i), att: null }));
  roster.slice(0, 18).forEach((r, i) => r.att = { kind: 'present', at: 612 + Math.floor(i / 3) });

/* fake QR: finder squares plus deterministic noise */
const QR = (() => {
  const n = 29; let s = 7, cells = '';
  const rnd = () => (s = (s * 9301 + 49297) % 233280) / 233280;
  const finder = (x, y) => `<rect x="${x}" y="${y}" width="7" height="7"/><rect x="${x + 1}" y="${y + 1}" width="5" height="5" fill="#fff"/><rect x="${x + 2}" y="${y + 2}" width="3" height="3"/>`;
  for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) {
    const inF = (x < 8 && y < 8) || (x > n - 9 && y < 8) || (x < 8 && y > n - 9);
    if (!inF && rnd() > .52) cells += `<rect x="${x}" y="${y}" width="1" height="1"/>`;
  }
  return `<svg viewBox="-2 -2 ${n + 4} ${n + 4}" shape-rendering="crispEdges" aria-label="Session QR code"><rect x="-2" y="-2" width="${n + 4}" height="${n + 4}" fill="#fff"/><g fill="#111">${cells}${finder(0, 0)}${finder(n - 7, 0)}${finder(0, n - 7)}</g></svg>`;
})();

/* --- Comment inbox --- */
function inboxItems() {
  let cs = S.comments.filter(c => c.status === S.inbox && (S.topicFilter === 'all' || c.topic === S.topicFilter)).slice().reverse();
  if (S.grouping !== 'grouped') return cs.map(c => ({ one: c }));
  const out = [], groups = {};
  cs.forEach(c => {
    if (!c.quick) return out.push({ one: c });
    const k = c.topic + '|' + c.text;
    if (!groups[k]) { groups[k] = { group: [], key: k }; out.push(groups[k]); }
    groups[k].group.push(c);

}

  return `<div class="proj"><div class="qr">${QR}</div><div class="col"><div class="p-course">Software Engineering · Session 7</div><h1>Sequence diagrams</h1>
    ${S.window === 'open' ? `<div class="p-say">Scan with your phone camera to check in</div><div class="p-big"><span class="hl">${t.present}</span></div><div class="p-say">checked in</div>` : `<div class="p-say">Check-in is closed. Ask me if you need marking.</div>`}
    <div class="p-url">cc.ofeq.dev</div></div></div>`;
}
function screenCtl() {
  const open = S.polls.find(p => p.status === 'open') || S.polls.find(p => p.status === 'closed');
  return `<div class="screen-ctl"><span class="small">On the projector</span><span class="seg">
    <button class="${S.screen === 'qr' ? 'on' : ''}" data-a="screen" data-v="qr">QR + count</button>
    <button class="${S.screen === 'poll' ? 'on' : ''}" data-a="screen" data-v="poll" ${open ? '' : 'disabled'}>Poll</button>
    <button class="${S.screen === 'blank' ? 'on' : ''}" data-a="screen" data-v="blank">Blank</button></span></div>`;
}

/* ================= variants ================= */
const SESSION_LINE = `Software Engineering · Session 7 · Sequence diagrams · 10:15–11:45 · 2.104`;
function VariantA() {
  let html = `<div class="va"><header class="a-top"><div class="grow"><div class="t">Session 7 · Sequence diagrams</div><div class="small muted">Software Engineering · Tue 24 Nov · 10:15–11:45 · room 2.104 · now ${fmt(S.clock)}</div></div>
    <nav class="a-nav"><button data-v="live" class="${S.view === 'live' ? 'on' : ''}" data-a="aview">Live</button><button data-v="roster" class="${S.view === 'roster' ? 'on' : ''}" data-a="aview">Roster</button></nav>
    <button class="btn" data-a="project">Show on projector</button></header>`;
  html += S.view === 'live'
    ? `<div class="a-grid">${attendanceArea({ noProject: true })}${inboxArea({ tally: true })}${pollsArea()}</div>`
    : rosterArea({ table: true });
  html += '</div>';
  if (S.projecting) html += `<div class="a-proj">${projector()}<div class="ctl">${screenCtl()}<button class="btn" data-a="unproject">Back to console (Esc)</button></div><div class="ctl">Your laptop shows this full screen; Comments and Pending names stay off it.</div></div>`;
  return html;
}
const BTABS = [['att', 'Attendance'], ['poll', 'Polls'], ['cm', 'Inbox'], ['ros', 'Roster']];
function VariantB() {
  const pend = tally().pending, nw = newCount(), live = S.polls.filter(p => p.status === 'open').length;
  const badge = { att: pend, cm: nw, poll: live };
  const body = { att: () => attendanceArea(), poll: pollsArea, cm: () => inboxArea({ tally: true }), ros: () => rosterArea() }[S.tab]();
  return `<div class="vb-wrap"><div class="phone"><div class="ph-top"><b>Session 7 · Sequence diagrams</b><div class="small muted">10:15–11:45 · now ${fmt(S.clock)}</div></div>${body}
    <nav class="tabbar">${BTABS.map(([k, l]) => `<button class="tab ${S.tab === k ? 'on' : ''}" data-a="btab" data-v="${k}">${l}${badge[k] ? `<span class="badge">${badge[k]}</span>` : ''}</button>`).join('')}</nav></div></div>`;
}
function nowFeed() {
  const t = tally(), blocks = pendingBlocks();
  const open = S.polls.filter(p => p.status === 'open'), next = S.polls.filter(p => p.status === 'scheduled').sort((a, b) => a.opensAt - b.opensAt)[0];
  const newTyped = S.comments.filter(c => c.status === 'New' && !c.quick).slice().reverse();
  let h = `<section class="sec" data-s="att">${screenCtl()}`;
  h += `<div class="card attn"><div class="row"><b class="grow"><span class="hl">${t.present}</span> of ${t.total} present</b>${S.window === 'open' ? '<span class="chip c-ok">Check-in open</span>' : '<span class="chip c-mute">Check-in closed</span>'}</div>
    <div class="row wrap small"><span class="muted grow">${t.missing} not checked in</span>${S.window === 'open' ? `<button class="btn btn-line btn-sm" data-a="closeWindow">Close Check-in</button>` : `<button class="btn btn-sm" data-a="openWindow">Reopen</button>`}<button class="link small" data-a="cv" data-v="roster">Mark someone</button></div></div>`;
  blocks.forEach(([block, rs]) => {
    h += `<div class="card attn warn"><b>${plural(rs.length, 'Pending check-in')}</b><span class="small">${rs.map(r => esc(r.name)).join(', ')} · from <span class="ip">${block}</span></span>
      <button class="btn btn-ok" data-a="approve" data-b="${block}">Approve network for this Session</button></div>`;
  });
  open.forEach(p => {
    h += `<div class="card attn" style="--hl:var(--hl-poll)"><div class="row"><span class="chip c-ok">Open poll</span><span class="small muted">${plural(p.counts.reduce((a, b) => a + b, 0), 'vote')}</span></div><div class="poll-q">${esc(p.q)}</div>${bars(p)}
      <button class="btn" data-a="pclose" data-id="${p.id}">Close and show results</button></div>`;
  });
  if (!open.length && next) h += `<div class="card attn" style="--hl:var(--hl-poll)"><span class="small muted">Next poll opens ${fmt(next.opensAt)}</span><div class="poll-q">${esc(next.q)}</div><button class="btn btn-line btn-sm" data-a="popen" data-id="${next.id}">Open now</button></div>`;
  const tl = liveTally();
  h += `<div class="card attn" style="--hl:var(--hl-cm)"><div class="row"><b class="grow">Comments</b><button class="link small" data-a="cv" data-v="inbox">Inbox (${newCount()} new)</button></div>${tl || '<span class="small muted">No quick reactions yet.</span>'}
    ${newTyped.slice(0, 3).map(c => `<div class="small"><b>${esc(who(c))}:</b> ${esc(c.text)}</div>`).join('')}</div>`;
  return h + '</section>';
}
function VariantC() {
  const sub = { now: nowFeed, inbox: () => inboxArea(), polls: pollsArea, roster: () => rosterArea() }[S.cview]();
  const title = { now: 'Now', inbox: 'Inbox', polls: 'Polls', roster: 'Roster' }[S.cview];
  return `<div class="vc"><div class="vc-stage"><div class="frame">${projector()}</div><p class="cap">The projector (laptop on HDMI, full screen). Public: Students see this. Driven from the phone.</p></div>
    <div class="phone">${S.cview === 'now' ? `<div class="ph-top"><b>Session 7 · now ${fmt(S.clock)}</b><div class="small muted">Remote · only you see this</div></div>` : `<div class="c-back"><button class="link" data-a="cv" data-v="now">← Now</button><b>${title}</b></div>`}
      ${sub}<nav class="c-nav"><button data-a="cv" data-v="inbox">Inbox</button><button data-a="cv" data-v="polls">Polls</button><button data-a="cv" data-v="roster">Roster</button></nav></div></div>`;
}
const RENDER = { a: VariantA, b: VariantB, c: VariantC };

/* ================= actions ================= */
const rosterById = id => S.roster.find(r => r.id === id);
function tickClock(mins) {
  for (let i = 0; i < mins; i++) {
    S.clock++;
    S.polls.forEach(p => {
      if (p.status === 'scheduled' && p.opensAt <= S.clock) { p.status = 'open'; toast(`Scheduled poll opened: ${p.q}`); }
      if (p.status === 'open' && p.closesAt && p.closesAt <= S.clock) { p.status = 'closed'; toast(`Poll closed: ${p.q}`); }
      if (p.status === 'open') { const n = 1 + Math.floor(Math.random() * 3); for (let k = 0; k < n; k++) p.counts[Math.floor(Math.random() * p.options.length)]++; }
    });
  }
}
function studentCheckin(where) {
  const r = S.roster.find(x => !x.att && x.claimed);
  if (!r) return toast('Every claimed Student has checked in.');
  if (S.window !== 'open') return toast(`${r.name} scanned; Check-in is closed, so their phone says “Ask the Lecturer to mark you present.”`);
  if (where === 'classroom') { r.att = { kind: 'present', at: S.clock }; return; }
  const block = OFFNETS[S.offIdx = ((S.offIdx ?? -1) + 1) % OFFNETS.length];
  r.att = S.approved.includes(block) ? { kind: 'present', at: S.clock, via: block } : { kind: 'pending', at: S.clock, block };
}
function studentComment(kind) {
  const presentIdx = S.roster.map((r, i) => isPresent(r) ? i : -1).filter(i => i >= 0);
  const w = presentIdx[Math.floor(Math.random() * presentIdx.length)];
  let c;
  if (kind === 'quick') { const t = QUICK[Math.floor(Math.random() * 2)]; c = { who: Math.random() < .3 ? null : w, text: t, quick: true }; }
  else { const [t, anon] = TYPED[S.typedIdx++ % TYPED.length]; c = { who: anon ? null : w, text: t, quick: false }; }
  S.comments.push({ id: S.nextId++, topic: 's7', when: 'during', status: 'New', at: fmt(S.clock), ...c });
  S.fresh = S.nextId - 1;
}
function parseTime(v) { const [h, m] = v.split(':').map(Number); return h * 60 + m; }
function submitPoll() {
  const f = S.pollForm, options = f.options.map(o => o.trim()).filter(Boolean);
  if (!f.q.trim() || options.length < 2) return toast('A poll needs a question and at least two answers.');
  const opensAt = f.open === 'at' ? parseTime(f.openAt) : S.clock;
  const closesAt = f.open === 'later' ? null : f.close === 'after' ? opensAt + +f.mins : f.close === 'at' ? parseTime(f.closeAt) : null;
  const status = f.open === 'now' ? 'open' : f.open === 'at' ? (opensAt <= S.clock ? 'open' : 'scheduled') : 'saved';
  S.polls.push({ id: S.nextId++, topic: f.topic, q: f.q.trim(), options, counts: options.map(() => 0), status, opensAt, closesAt });
  S.pollForm = null;
  toast(status === 'open' ? 'Poll open. Students get a badge and banner.' : status === 'scheduled' ? `Scheduled for ${fmt(opensAt)}` : 'Saved');
}
function act(a, d) {
  switch (a) {
    case 'closeWindow':
      S.window = 'closed';
      S.roster.forEach(r => { if (r.att && r.att.kind === 'pending') { r.att = null; r.lapsed = true; } });
      toast('Check-in closed. Pending check-ins count as Absent.');
      break;
    case 'openWindow': S.window = 'open'; S.windowAt = S.clock; break;
    case 'approve': {
      S.approved.push(d.b);
      let n = 0;
      S.roster.forEach(r => { if (r.att && r.att.kind === 'pending' && r.att.block === d.b) { r.att = { kind: 'present', at: r.att.at, via: d.b }; n++; } });
      toast(`${plural(n, 'Student')} now present. ${d.b} accepted for Session 7 only.`);
      break;
    }
    case 'mark': { const r = rosterById(d.id); const prev = r.att; r.att = { kind: d.v, at: S.clock }; S.undo = () => r.att = prev; toast(`${r.name} marked ${d.v === 'manual' ? 'present' : 'absent'}`, true); break; }
    case 'reset': { const r = rosterById(d.id); r.claimed = false; S.undo = () => r.claimed = true; toast(`Claim reset for ${r.name}. They can claim from their new phone.`, true); break; }
    case 'undo': if (S.undo) S.undo(); S.undo = null; S.toast = null; break;
    case 'export': toast('Would download software-engineering-attendance.xlsx (Roster × Sessions).'); break;
    case 'inbox': S.inbox = d.v; break;
    case 'cstatus': {
      const ids = d.ids.split(',').map(Number), cs = S.comments.filter(c => ids.includes(c.id)), prev = cs.map(c => c.status);
      cs.forEach(c => c.status = d.v); S.undo = () => cs.forEach((c, i) => c.status = prev[i]);
      toast(`${plural(cs.length, 'Comment')} → ${d.v}`, true); break;
    }
    case 'expand': S.expanded[d.k] = !S.expanded[d.k]; break;
    case 'pnew': S.pollForm = { q: '', options: ['', '', ''], topic: 's7', open: 'now', openAt: fmt(S.clock + 10).padStart(5, '0'), close: 'hand', mins: 3, closeAt: fmt(S.clock + 15).padStart(5, '0') }; break;
    case 'padd': S.pollForm.options.push(''); break;
    case 'pf': S.pollForm[d.k] = d.v; break;
    case 'pcancel': S.pollForm = null; break;
    case 'popen': { const p = S.polls.find(x => x.id === +d.id); p.status = 'open'; p.opensAt = S.clock; if (p.closesAt && p.closesAt <= S.clock) p.closesAt = null; break; }
    case 'pclose': { const p = S.polls.find(x => x.id === +d.id); p.status = 'closed'; p.closesAt = S.clock; toast('Closed. Students now see the results.'); break; }
    case 'pdel': S.polls = S.polls.filter(x => x.id !== +d.id); break;
    case 'pshow': S.screen = 'poll'; S.screenPoll = +d.id; if (S.variant === 'a') S.projecting = true; break;
    case 'screen':
      S.screen = d.v;
      if (d.v === 'poll') { const p = S.polls.find(x => x.status === 'open') || S.polls.filter(x => x.status === 'closed').pop(); S.screenPoll = p && p.id; }
      break;
    case 'project': S.projecting = true; if (S.variant !== 'a') S.screen = 'qr'; break;
    case 'unproject': S.projecting = false; break;
    case 'aview': S.view = d.v; break;
    case 'btab': S.tab = d.v; break;
    case 'cv': S.cview = d.v; break;
    case 'importOpen': S.importBox = { text: '' }; break;
    case 'importFile': S.importBox.text = '318245671, Noa Levi\n318253590, Amir Haddad\n340120001, Gal Navon\n340120002, Sivan Oren'; break;
    case 'importCancel': S.importBox = null; break;
    case 'importDo': {
      const rows = S.importBox.text.split('\n').map(l => l.split(/[,\t]/).map(s => s.trim())).filter(r => r[0] && r[1] && !S.roster.some(x => x.id === r[0]));
      rows.forEach(([id, name]) => S.roster.push({ id, name, claimed: false, att: null }));
      S.importBox = null; toast(`${plural(rows.length, 'Student')} added. They claim their entry on first scan.`); break;
    }
    /* scenario */
    case 'sIn': studentCheckin('classroom'); break;
    case 'sOff': studentCheckin('off'); break;
    case 'sIn5': for (let i = 0; i < 5; i++) studentCheckin('classroom'); break;
    case 'sQuick': studentComment('quick'); break;
    case 'sTyped': studentComment('typed'); break;
    case 'sTick': tickClock(+d.v); break;
    case 'set': S[d.k] = d.v; break;
    case 'panel': S.panel = !S.panel; break;
    case 'resetAll': { const keep = { variant: S.variant, look: S.look, grouping: S.grouping, panel: S.panel }; S = { ...initial(), ...keep }; break; }
    case 'vprev': case 'vnext': {
      const i = VARIANTS.findIndex(v => v.k === S.variant);
      setVariant(VARIANTS[(i + (a === 'vnext' ? 1 : -1) + VARIANTS.length) % VARIANTS.length].k); return;
    }
  }
  render();
}

/* ================= render ================= */
function pseg(k, opts) { return `<div class="pseg">${opts.map(([v, l]) => `<button class="${S[k] === v ? 'on' : ''}" data-a="set" data-k="${k}" data-v="${v}">${l}</button>`).join('')}</div>`; }
function renderPanel() {
  const t = tally();
  const dump = {
    variant: S.variant, look: S.look, grouping: S.grouping, clock: fmt(S.clock), checkinWindow: S.window, approvedNetworks: S.approved,
    attendance: t, pending: Object.fromEntries(pendingBlocks().map(([b, rs]) => [b, rs.map(r => r.name)])),
    projector: S.screen + (S.screen === 'poll' ? ` #${S.screenPoll}` : ''), projecting: S.projecting,
    polls: S.polls.map(p => `${p.status}: ${p.q} [${p.counts.join('/')}]`),
    comments: ['New', 'Pinned', 'Addressed', 'Ignored'].map(s => `${s} ${S.comments.filter(c => c.status === s).length}`).join(', '),
  };
  $('panel').innerHTML = `<div class="row"><h2 class="grow">Scenario</h2><button class="pb" data-a="panel">Hide</button></div>
    <p>Plays the Students and the clock. Throwaway prototype; reload resets it.</p>
    <div class="g"><span class="eyebrow">Open questions</span>
      <div>Look ${pseg('look', [['binder', 'Binder (from Student app)'], ['plain', 'Plain']])}</div>
      <div>Quick reactions in the inbox ${pseg('grouping', [['grouped', 'Grouped with counts'], ['each', 'One by one']])}</div></div>
    <div class="g"><span class="eyebrow">Students</span>
      <button class="pb" data-a="sIn">A Student checks in from the classroom Wi-Fi</button>
      <button class="pb" data-a="sIn5">Five Students check in from the classroom Wi-Fi</button>
      <button class="pb" data-a="sOff">A Student checks in from another network (mobile data)</button>
      <button class="pb" data-a="sQuick">A Student sends a quick reaction</button>
      <button class="pb" data-a="sTyped">A Student types a Comment</button></div>
    <div class="g"><span class="eyebrow">Clock (${fmt(S.clock)}; votes trickle in, scheduled polls fire)</span>
      <div class="pseg"><button data-a="sTick" data-v="1">+1 min</button><button data-a="sTick" data-v="5">+5 min</button><button data-a="sTick" data-v="15">+15 min</button></div></div>
    <button class="pb" data-a="resetAll">Reset everything</button>
    <details open><summary class="eyebrow">State</summary><pre>${esc(JSON.stringify(dump, null, 1))}</pre></details>`;
}
function renderSwitcher() {
  const v = VARIANTS.find(x => x.k === S.variant);
  $('switcher').innerHTML = `<button data-a="vprev" aria-label="Previous variant">←</button><span class="lbl-v">${v.k.toUpperCase()} · ${v.name}</span><button data-a="vnext" aria-label="Next variant">→</button><button class="scen" data-a="panel">Scenario</button>`;
}
function renderToast() {
  $('toast').innerHTML = S.toast ? `<div class="toast" role="status"><span>${esc(S.toast.msg)}</span>${S.toast.undo ? `<button class="link" data-a="undo">Undo</button>` : ''}</div>` : '';
}
function render() {
  const scrolls = [...document.querySelectorAll('#stage .sec')].map(e => e.scrollTop);
  const f = document.activeElement, fKey = f && (f.dataset.in || f.dataset.f), fPos = f && f.selectionStart;
  document.body.className = `look-${S.look}${S.panel ? ' panel-open' : ''}`;
  $('stage').innerHTML = RENDER[S.variant]();
  [...document.querySelectorAll('#stage .sec')].forEach((e, i) => { if (scrolls[i]) e.scrollTop = scrolls[i]; });
  if (fKey) { const el = document.querySelector(`[data-in="${fKey}"], [data-f="${fKey}"]`); if (el) { el.focus(); try { el.setSelectionRange(fPos, fPos); } catch (_) {} } }
  renderPanel(); renderSwitcher(); renderToast();
  S.fresh = null;
}
function setVariant(k) { S.variant = k; S.projecting = false; if (location.hash !== '#' + k) location.hash = k; render(); }

document.addEventListener('click', e => {
  const el = e.target.closest('[data-a]');
  if (!el || el.tagName === 'SELECT' || el.disabled) return;
  e.preventDefault();
  act(el.dataset.a, el.dataset);
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset.in === 'rosterQ') { S.rosterQ = t.value; render(); }
  if (t.dataset.in === 'importText') { S.importBox.text = t.value; render(); }
  if (t.dataset.f && S.pollForm) { const k = t.dataset.f; if (/^o\d$/.test(k)) S.pollForm.options[+k.slice(1)] = t.value; else S.pollForm[k] = t.value; }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.in === 'topicFilter') { S.topicFilter = t.value; render(); }
  if (t.dataset.f && S.pollForm) { S.pollForm[t.dataset.f] = t.value; }
});
document.addEventListener('submit', e => { e.preventDefault(); if (e.target.dataset.form === 'poll') { submitPoll(); render(); } });
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && S.projecting) { S.projecting = false; render(); return; }
  if (e.target.closest('input, textarea, select, [contenteditable]')) return;
  if (e.key === 'ArrowRight') act('vnext', {});
  if (e.key === 'ArrowLeft') act('vprev', {});
});
window.addEventListener('hashchange', () => { const k = location.hash.slice(1); if (RENDER[k] && k !== S.variant) setVariant(k); });
const start = location.hash.slice(1);
if (RENDER[start]) S.variant = start;
render();
</script>
